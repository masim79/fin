# E2E harness. Lives in test/ so the Playwright browser dependencies stay out
# of the production image (PLAN.md section 12).
#
# Run from this directory:
#   docker compose -f docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from playwright
#
# The build context is the repo root (..) because the Dockerfile copies
# frontend/ and backend/ from there.

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      # Deterministic, free, offline chat responses — the E2E default.
      - LLM_MOCK=true
      # Empty forces the built-in simulator rather than the Massive API.
      - MASSIVE_API_KEY=
      # Throwaway DB inside the container; no volume, so each run starts clean.
      - DB_PATH=/tmp/test.db
      # Exposes POST /api/test/reset so each test starts from seeded state.
      - E2E_TEST_MODE=true
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status==200 else 1)\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  playwright:
    image: mcr.microsoft.com/playwright:v1.52.0-jammy
    depends_on:
      app:
        condition: service_healthy
    environment:
      - BASE_URL=http://app:8000
      - CI=true
    working_dir: /work
    volumes:
      - .:/work
    command: sh -c "npm ci && npx playwright test"
